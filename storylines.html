<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<title>GW Storylines</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="quests">
<div class="wrap">
  <header class="top"></header><script src="header.js"></script>
  <div class="page-title"><h1>Storylines</h1><p>The story of each campaign, step by step</p></div>

  <div id="story">
  <div class="q-controls">
    <div class="profs" id="camps"></div>
  </div>
  <div class="q-legend">
    <span><i class="lg mission"></i>Mission</span>
    <span id="legend-primary"><i class="lg primary"></i>Primary quest</span>
    <span id="legend-attr"><i class="lg attribute"></i>Attribute points</span>
    <span id="legend-hero"><span class="qn-hero lg-hero"><img src="img/prof/Any.png" alt=""></span>Required hero</span>
    <span id="legend-inferred"><i class="lg-line"></i>Placed by region</span>
  </div>

  <div class="q-layout">
    <div class="q-canvas-wrap"><div class="q-canvas" id="canvas"></div></div>
    <aside class="q-detail" id="detail"><p class="dim">Click a step to see its details.</p></aside>
  </div>
  </div>

  <footer class="site-footer"><a href="about">About</a> · <a href="thanks">Thanks</a> · <a href="contact">Contact</a> · <a href="license">License &amp; credits</a> · Code MIT · Data CC BY-NC-SA 4.0 from GuildWiki.de · Not affiliated with ArenaNet or NCSOFT</footer>
</div>

<script src="common.js"></script>
<script src="mapwidget.js"></script>
<script src="storylines.js"></script>
</body>
</html>
