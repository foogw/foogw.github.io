<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<title>GW Skills</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="skills">
<div class="wrap">
  <header class="top"></header><script src="header.js"></script>
  <div class="page-title"><h1>Skills</h1><p>Every skill, with capture bosses, trainers and quests</p></div>

  <div id="browse">
  <div class="filters" id="filters">
    <div class="frow">
      <input type="search" id="f-name" placeholder="Name — e.g. sig, mantra, &quot;save" autocomplete="off" autofocus>
      <input type="search" id="f-text" placeholder="Description — e.g. condition, knockdown, energy" autocomplete="off">
      <span class="search-hint"><kbd>/</kbd> search · <kbd>Esc</kbd> clear</span>
    </div>
    <div class="frow">
      <div class="profs" id="f-prof"></div>
    </div>
    <div class="frow">
      <select id="f-attr"><option value="">Any attribute</option></select>
      <select id="f-type"><option value="">Any type</option></select>
      <select id="f-camp"><option value="">Any campaign</option></select>
      <select id="f-src">
        <option value="">Any source</option>
        <option value="capture">Capturable</option>
        <option value="skill trainer">Skill trainer</option>
        <option value="hero skill trainer">Hero skill trainer</option>
        <option value="quest">Quest reward</option>
        <option value="title">PvE-only (title)</option>
      </select>
      <label class="chk"><input type="checkbox" id="f-elite"> Elite only</label>
      <label class="chk u-char" title="Elites the character picked on My Characters hasn't captured"><input type="checkbox" id="f-cap"> To capture</label>
      <label class="chk"><input type="checkbox" id="f-pvp"> PvP versions</label>
      <button class="reset" id="reset">Reset</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="head" id="head">
    <button data-sort="name">Name</button>
    <button data-sort="profession">Profession</button>
    <button data-sort="attribute" class="col-attr">Attribute</button>
    <button data-sort="type" class="col-type">Type</button>
    <button data-sort="cost">Cost</button>
    <button data-sort="activation" class="num col-act">Activation</button>
    <button data-sort="recharge" class="num col-rech" title="Recharge">Rech</button>
    <button data-sort="campaign" class="col-camp" title="Campaign">Camp</button>
    <span>Description</span>
    <span class="col-tick bulk" tabindex="0" title="Captured, for the character picked on My Characters">✓<span class="bulk-slot" data-list="#list"></span></span>
  </div>
  <p class="u-pre-note dim"></p>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>No skills match.</div>
  </div>
  <footer class="site-footer"><a href="about">About</a> · <a href="thanks">Thanks</a> · <a href="contact">Contact</a> · <a href="license">License &amp; credits</a> · Code MIT · Data CC BY-NC-SA 4.0 from GuildWiki.de · Not affiliated with ArenaNet or NCSOFT</footer>
</div>

<script src="game/skills.js"></script>
<script src="game/ground.js"></script>
<script src="game/missions.js"></script>
<script src="game/quests.js"></script>
<script src="game/creatures.js"></script>
<script src="game/titles.js"></script>
<script src="data/builds.js"></script>
<script src="data/aliases.js"></script>
<script src="common.js"></script>
<script src="template-code.js"></script>
<script src="skills.js"></script>
</body>
</html>
