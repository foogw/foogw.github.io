<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<title>Guild Wars Today</title>
<link rel="stylesheet" href="style.css">
<style>
  .home { max-width: 1000px; }
  .hero { padding: 8px 0 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
  .hero h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
  .hero p { margin: 0; color: var(--muted); }
  .gsearch { margin: 18px 0 6px; }
  .gsearch input {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; font: inherit; font-size: 16px;
  }
  .gsearch input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .results { margin-top: 8px; }
  .results h2, .sections h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
  .hit {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 10px 7px 12px; position: relative;
    border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text);
  }
  .hit::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px; border-radius: 2px; background: var(--pc); }
  .hit:hover, .hit.sel { background: var(--panel); }
  .hit .t { font-weight: 600; }
  .hit.elite .t { color: var(--elite); }
  .hit .s { color: var(--muted); font-size: 13px; }
  .more { color: var(--muted); font-size: 13px; padding: 6px 12px; display: block; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick a { text-decoration: none; }
  .tpl-bar { display: flex; gap: 8px; align-items: center; margin: 12px 0 4px; flex-wrap: wrap; }
  .tpl-bar input {
    flex: 1 1 320px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font: inherit; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
  }
  .tpl-bar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tpl-bar button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; font: inherit; cursor: pointer;
  }
  .tpl-bar button:hover { border-color: var(--accent); }
  .tpl-msg { color: var(--sac); font-size: 12px; }
  .ev-card { padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 6px 6px 0; }
  .ev-card b a { color: var(--text); }
  .ev-card .ev-when { color: var(--muted); font-size: 13px; margin-left: 2px; }
  .ev-card p { margin: 2px 0 0; font-size: 14px; }
  .ev-card .what { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap topbar">
  <header class="top"></header><script src="header.js"></script>
</div>
<div class="wrap home">

  <div class="hero">
    <h1>Guild Wars Today</h1>
    <p>Today's quests, builds, maps, skills and more…</p>
  </div>

  <div class="gsearch">
    <input type="search" id="q" placeholder="Search Nick items, skills, missions, areas or quests — e.g. mursaat token, energy surge, thirsty, fow…" autocomplete="off" autofocus>
  </div>
  <div class="results" id="results"></div>

  <div class="sections" id="sections">
    <div id="ev-now"></div>
    <h2>Today <a class="h-more" href="rotations">Full rotations →</a></h2>
    <div class="today" id="today"></div>
    <div id="ev-next"></div>
    <h2>Something random <button class="h-more rnd-again" id="rnd-again" type="button">Another →</button></h2>
    <div class="rnd" id="rnd"></div>
    <form class="tpl-bar" id="tpl-form">
      <input type="text" id="tpl" placeholder="See a template — paste a skill template code" autocomplete="off" spellcheck="false">
      <button type="submit">Open in builder</button>
      <span class="tpl-msg" id="tpl-msg"></span>
    </form>
  </div>
  <div id="view" class="ent" hidden></div>
  <footer class="site-footer"><a href="about">About</a> · <a href="license">License &amp; credits</a> · <a href="thanks">Thanks</a> · <a href="contact">Contact</a> · Code MIT · Data CC BY-NC-SA 4.0 from GuildWiki.de · Not affiliated with ArenaNet or NCSOFT</footer>
</div>

<script src="game/skills.js"></script>
<script src="game/heroes.js"></script>
<script src="game/titles.js"></script>
<script src="game/missions.js"></script>
<script src="game/ground.js"></script>
<script src="game/maps.js"></script>
<script src="game/quests.js"></script>
<script src="game/creatures.js"></script>
<script src="game/calendar.js"></script>
<script src="data/calendar.js"></script>
<script src="data/nicholas.js"></script>
<script src="data/depths.js"></script>
<script src="data/routing.js"></script>
<script src="data/builds.js"></script>
<script src="data/aliases.js"></script>
<script src="common.js"></script>
<script src="mapwidget.js"></script>
<script src="walkroute.js"></script>
<script src="template-code.js"></script>
<script src="area.js"></script>
<script src="mission.js"></script>
<script src="dungeon.js"></script>
<script src="quest.js"></script>
<script src="skill.js"></script>
<script src="hero.js"></script>
<script src="boss.js"></script>
<script src="title.js"></script>
<script>
"use strict";
const SKILL_LIST = Object.values(SKILLS).filter(s => !s.pvp_only);
const MISSION_LIST = Object.values(MISSIONS);
const AREA_LIST = Object.values(AREAS).filter(l => !isPvP(l) && l.type !== 14 && l.type !== 17);
const QUEST_LIST = Object.values(QUESTS);
// every boss a mission names, with the mission
const BOSS_LIST = MISSION_LIST.flatMap(m => (m.bosses || []).map(b => ({ c: CREATURES[b.creature], m }))).filter(x => x.c);
for (const s of SKILL_LIST) s._k = fold(`${s.name} ${aliasText("skills", s.id)}`);
for (const m of MISSION_LIST) m._k = fold(`${m.name} ${aliasText("areas", m.id)} ${aliasText("areas", m.outpost)}`);
for (const l of AREA_LIST) l._k = fold(`${l.name} ${aliasText("areas", l.id)}`);
for (const q of QUEST_LIST) q._k = fold(q.name);
for (const x of BOSS_LIST) x.k = fold(x.c.name);
const STORY = new Set((QUESTDATA.storylines || []).flatMap(s => [...(s.nodes || []), ...(s.parts || []).flatMap(p => p.steps)]).map(n => n.quest).filter(Boolean));

// "Something random": a player build and a hero build from the Builds page, and today's Zaishen Vanquish on its map
const pick = ids => BUILDS.get(ids[Math.floor(Math.random() * ids.length)]);
function buildCardHTML(title, b) {
  if (!b) return "";
  let bar = null;
  try { bar = TemplateCode.decode(b.code); } catch { /* an unreadable code shows no bar */ }
  const profs = bar ? bar.professions.filter(Boolean) : [];
  return `<div class="rnd-card" style="--pc:${profVar(profs[0] || 0)}"><a href="${buildHref(b.id)}">
    <small>${title}</small><span class="rnd-bar">${(bar?.skills || []).filter(Boolean).map(id => skillIcon(id, "rnd-ic")).join("")}</span>
    <b>${esc(b.name)}</b><span class="dim">${esc(profs.map(p => PROFS[p]).join(" / ") || "Any profession")}</span></a>
    <button class="link rnd-copy" type="button" data-copy="${esc(b.code)}">Copy template</button></div>`;
}
function renderRandom() {
  const vq = Rotation.current(ROTATIONS["zaishen-vanquish"])?.area;
  $("rnd").innerHTML = `<div class="rnd-builds">${buildCardHTML("Player build", pick(BUILDDATA.players))}
    ${buildCardHTML("Hero build", pick(BUILDDATA.singles))}</div>`
    + (AREAS[vq]?.set != null ? `<div class="rnd-map"><small>Today's Zaishen Vanquish: ${LINK.area(vq)}</small>${mapHTML([vq])}</div>` : "");
  initMaps($("rnd"));
}
$("rnd-again").addEventListener("click", renderRandom);

const TODAY = [["zaishen-mission", "Mission"], ["zaishen-bounty", "Bounty"], ["zaishen-vanquish", "Vanquish"],
  ["nicholas-sandford", "Sandford"], ["vanguard", "Vanguard"], null, ["weekly-pve", "PvE bonus"], ["nicholas-traveler", "Nicholas"]];
const renderToday = () => { $("today").innerHTML = rotationListHTML(TODAY); };
renderToday();
setInterval(renderToday, 30000);

// the running event above Today, the next one below it
function renderEvents() {
  const now = new Date();
  const evs = Object.values(EVENTS).map(e => ({ e, w: eventWindow(e, now) })).sort((a, b) => a.w[0] - b.w[0]);
  const card = ({ e, w: [a, b] }, state) => `<div class="ev-card"><b><a href="events">${esc(e.name)}</a></b> `
    + `<span class="ev-when">${state === "on" ? `ends ${eventAway(b - now)}` : `${state === "soon" ? "coming" : "starts"} ${eventAway(a - now)}`}</span>`
    + `<p>${text(e.blurb, true)}</p></div>`;
  const on = evs.filter(x => x.w[0] <= now), later = evs.filter(x => x.w[0] > now);
  // with nothing on, an event starting within three days moves up above Today, and the one after it takes its area
  const soon = !on.length && later[0] && later[0].w[0] - now < 3 * 86400000 ? later.shift() : null;
  const more = `<a class="h-more" href="events">All events →</a>`;
  $("ev-now").innerHTML = on.length ? `<h2>On now ${more}</h2>` + on.map(x => card(x, "on")).join("")
    : soon ? `<h2>Coming up ${more}</h2>` + card(soon, "soon") : "";
  $("ev-next").innerHTML = later[0] ? `<h2>Next event ${more}</h2>` + card(later[0], "next") : "";
}
renderEvents();
setInterval(renderEvents, 60000);
renderRandom();

// the site's own pages, found by name or by what they hold
const PAGES = [
  ["Skills", "skills", "All skills with filters, capture bosses and trainers", "skill list elite capture trainer"],
  ["Missions", "missions", "Missions with rewards, bosses and foes", "mission boss reward foe pvp"],
  ["Storylines", "storylines", "The story per campaign: primary quests and missions", "quest quests mission missions story flow primary campaign"],
  ["Quests", "quests", "Every quest: primary, secondary, event and more", "quest quests secondary event all"],
  ["Skill quests", "quests?sq=1", "Every quest that rewards a skill", "skill quest quests reward"],
  ["Bosses", "bosses", "Every boss: its elite to capture and where it is", "boss bosses elite capture signet"],
  ["Heroes", "heroes", "Which campaigns each hero needs, and how to recruit them", "hero heroes recruit campaign"],
  ["Armor", "armor", "Craftable armor sets: gold, materials and where", "armor armour set crafter material gold prestige elite"],
  ["Guides", "guides", "Step-by-step guides: the GoM AFK XP farm", "guide guides farm xp gom gate madness afk survivor"],
  ["Skillbar builder", "builder", "Template codes, attributes and skill bars", "builder build bar template code attributes"],
  ["Rotations", "rotations", "Zaishen dailies, Nicholas and weekly bonuses", "rotation rotations zaishen daily weekly nicholas bonus bounty vanquish"],
  ["About", "about", "What this site is and how it works", "about site"],
  ["Contact", "contact", "How to reach the site's author", "contact discord"],
  ["Thanks", "thanks", "Everyone this site builds on", "thanks credits contributors"],
  ["License & credits", "license", "Sources and licenses", "license credits copyright"],
].map(([name, href, about, words]) => ({ name, href, about, _k: fold(`${name} ${words}`) }));

// "See a template": a valid code opens in the builder
function openTemplate() {
  const code = $("tpl").value.trim().replace(/^.*#code=/, "");
  if (!code) return;
  try {
    TemplateCode.decode(code);
    location.href = "builder?code=" + encodeURIComponent(code);
  } catch (e) {
    $("tpl-msg").textContent = "That isn't a skill template code.";
  }
}
$("tpl-form").addEventListener("submit", e => { e.preventDefault(); openTemplate(); });
$("tpl").addEventListener("paste", () => setTimeout(openTemplate, 0));
$("tpl").addEventListener("input", () => { $("tpl-msg").textContent = ""; });

const LIMIT = 8;
// a date later than this year shows its year (Nicholas the Traveler's items come round only every few years)
const fmtDay = new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric" });
const fmtYear = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" });
const fmtNext = { format: t => (new Date(t).getFullYear() === new Date().getFullYear() ? fmtDay : fmtYear).format(t) };
const rank = (k, t) => (k.startsWith(t) ? 0 : k.includes(" " + t) ? 1 : 2);

function search(q) {
  const ts = fold(q).split(/\s+/).filter(Boolean);
  if (!ts.length) return null;
  // a typed plural also finds the singular ("mursaat tokens", "energy surges")
  const has = k => ts.every(t => k.includes(t) || (t.length > 3 && t.endsWith("s") && k.includes(t.slice(0, -1))));
  const best = (list, k = x => x._k) => list.filter(x => has(k(x))).sort((a, b) => rank(k(a), ts[0]) - rank(k(b), ts[0]) || cmpStr(a.name ?? a.c.name, b.name ?? b.c.name));
  // a word matches as typed or as its plural/singular ("skills" finds "skill quests")
  const word = (w, t) => w.startsWith(t) || (w.length >= 4 && t.startsWith(w) && t.length - w.length <= 1);
  // rotation entries (Nicholas's items, bounty targets, bonuses...), once per rotation, by when they're next up
  const rotations = [];
  for (const r of Object.values(ROTATIONS)) {
    const seen = new Set();
    for (const e of r.entries) {
      const n = entryName(e);
      if (seen.has(n) || !has(fold(n))) continue;
      seen.add(n);
      const k = Rotation.period(r);
      let i = 0;
      while (i < r.entries.length && entryName(Rotation.entry(r, k + i)) !== n) i++;
      rotations.push({ r, e: Rotation.entry(r, k + i), i, at: Rotation.startsAt(r, k + i) });
    }
  }
  rotations.sort((a, b) => a.at - b.at);
  return { ts, pages: PAGES.filter(p => ts.every(t => p._k.split(" ").some(w => word(w, t)))), skills: best(SKILL_LIST),
    missions: best(MISSION_LIST), areas: best(AREA_LIST), quests: best(QUEST_LIST), bosses: best(BOSS_LIST, x => x.k), rotations };
}

function section(title, items, render, moreHref) {
  if (!items.length) return "";
  return `<h2>${title} · ${items.length}</h2>` + items.slice(0, LIMIT).map(render).join("")
    + (items.length > LIMIT && moreHref ? `<a class="more" href="${moreHref}">Show all ${items.length} →</a>` : "");
}

function render() {
  const q = $("q").value, r = search(q);
  $("sections").hidden = !!r;
  if (!r) { $("results").innerHTML = ""; return; }
  const qs = encodeURIComponent(q);
  const hit = (pc, href, title, sub, right) => `<a class="hit" style="--pc:${pc}" href="${href}"><span>${title} <span class="s">${sub}</span></span><span class="s">${right}</span></a>`;
  $("results").innerHTML =
    section("Pages", r.pages, p => hit("var(--accent)", p.href, `<span class="t">${esc(p.name)}</span>`, esc(p.about), "→")) +
    section("Skills", r.skills, s => hit(profVar(s.profession), HREF.skill(s.id), `${skillIcon(s.id, "sk-ic sm")}<span class="t">${highlight(s.name, r.ts)}</span>`,
      `${s.profession ? PROFS[s.profession] : "Common"} · ${esc(ATTRIBUTES[s.attribute] || "")}`, esc(s.label || "")), `skills?q=${qs}`) +
    section("Missions", r.missions, m => hit(profVar(0), HREF.mission(m.id), `<span class="t">${highlight(m.name, r.ts)}</span>`,
      `${m.kind === "pvp" ? "PvP" : CAMPAIGNS[missionCampaign(m)]} · ${esc(missionRegion(m)?.name || "")}`, esc(m.kind === "story" ? "Mission" : m.kind)), `missions?q=${qs}`) +
    section("Areas", r.areas, l => hit(`var(${isOutpost(l) ? "--loc-out" : "--loc-exp"})`, HREF.area(l.id), `<span class="t">${highlight(l.name, r.ts)}</span>`,
      `${CAMPAIGNS[campaignOf(l)] || ""} · ${esc(regionOf(l)?.name || "")}`, esc(TYPE_LABEL[l.type] || "")), "areas") +
    section("Quests", r.quests, x => hit(STORY.has(x.id) ? profVar(0) : "var(--q-skill)", HREF.quest(x.id), `<span class="t">${highlight(x.name, r.ts)}</span>`,
      `${CAMPAIGNS[questCampaign(x)]} · ${esc(questRegion(x)?.name || "")}`, STORY.has(x.id) ? "Story quest" : x.skills?.length ? "Skill quest" : `${esc(x.type)} quest`), `quests?q=${qs}`) +
    section("Bosses", r.bosses, ({ c, m }) => hit(profVar(c.profession), HREF.boss(c.id), `<span class="t">${highlight(c.name, r.ts)}</span>`,
      esc(m.name), esc((c.elites || []).map(e => SKILLS[e]?.name).filter(Boolean).join(", "))), `bosses?q=${qs}`) +
    section("Rotations", r.rotations, ({ r: rot, e, i, at }) => hit("var(--accent)", `rotations${query({ q: entryName(e) })}`,
      `<span class="t">${e.count ? `${e.count} × ` : ""}${highlight(entryName(e), r.ts)}</span>`, `${esc(rot.title)}${e.creature && e.area ? ` · ${esc(areaName(e.area))}` : ""}`,
      i ? `next ${fmtNext.format(at)}` : "now")) ||
    `<p class="dim" style="padding:12px 0">Nothing found.</p>`;
}

$("q").addEventListener("input", () => {
  history.replaceState(null, "", $("q").value ? "?q=" + encodeURIComponent($("q").value) : location.pathname);
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("q").value = ""; render(); $("q").focus(); }
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});

// a game thing's own page (./?area=146, ./?skill=1234, …): the home page gives way to it
function route() {
  // a dungeon's old area link: its own page now
  if (AREAS[args().get("area")]?.type === 18) history.replaceState(null, "", HREF.dungeon(args().get("area")));
  const p = args(), k = Object.keys(VIEWS).find(k => p.has(k)), v = VIEWS[k], x = v?.find(p.get(k));
  for (const sel of [".hero", ".gsearch", "#results", "#sections"]) document.querySelector(sel).style.display = k ? "none" : "";
  $("view").hidden = !k;
  // the menu marks the list the thing is in
  const menu = { area: "areas", mission: "missions", skill: "skills", hero: "heroes" }[k] || "./";
  for (const a of document.querySelectorAll("nav.pages a")) if (a.getAttribute("href") === menu) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  if (!k) {
    $("view").innerHTML = "";
    document.title = TITLE;
    $("q").value = p.get("q") || "";
    render();
    return;
  }
  $("view").dataset.at = `${k}=${p.get(k)}`;
  $("view").innerHTML = x ? v.html(x) : `<p class="back"><a href="./">← Home</a></p><p class="dim">There's no ${esc(k)} ${esc(p.get(k))}.</p>`;
  if (x) { initMaps($("view")); v.after?.($("view"), x); }
  document.title = x ? `${v.title(x)} · GW` : TITLE;
  window.scrollTo(0, 0);
}
const TITLE = document.title;
route();
onRoute(route);
</script>
</body>
</html>
