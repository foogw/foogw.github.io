<!-- Nicholas the Traveler: where he stands this week (or the week picked, ?nick=<entry>), the way to him from the
     outposts nearby, and his whole rotation to search (nicholaspage.js, the map by nicholas.js) -->
<div class="wrap">
  <header class="top"></header><script src="header.js"></script>
  <div class="page-title"><h1>Nicholas the Traveler</h1><p>Where he stands each week, what he wants, and the way to him</p></div>

  <p class="nk-now" id="nk-now"></p>
  <div id="nk-map"></div>

  <h2 class="r-h">His rotation</h2>
  <div class="r-tools">
    <input type="search" id="find" placeholder="When does he want it? — e.g. iris, red iris flower, regent valley" autocomplete="off" autofocus>
    <span class="dim" id="nk-count"></span>
  </div>
  <div class="r-scroll"><table class="r-table" id="nk-table"></table></div>
