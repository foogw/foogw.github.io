<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<title>Guild Wars Today</title>
<link rel="stylesheet" href="style.css">
<style>
  .home { max-width: 1000px; }
  .hero { padding: 8px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; }  /* (the date picker at its right) */
  .hero h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
  .gsearch { margin: 18px 0 6px; }
  .gsearch input {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; font: inherit; font-size: 16px;
  }
  .gsearch input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .results { margin-top: 8px; }
  .results h2, .sections h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
  .hit {
    display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 10px 7px 12px; position: relative;
    border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text);
  }
  .hit::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px; border-radius: 2px; background: var(--pc); }
  .hit:hover, .hit.sel { background: var(--panel); }
  .hit .t { font-weight: 600; }
  .hit.elite .t { color: var(--elite); }
  .hit .s { color: var(--muted); font-size: 13px; }
  .more { color: var(--muted); font-size: 13px; padding: 6px 12px; display: block; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick a { text-decoration: none; }
  .ev-card { padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 6px 6px 0; margin-top: 18px; }
  .ev-line { display: flex; align-items: baseline; gap: 0 6px; flex-wrap: wrap; }
  .ev-k { color: var(--muted); }  /* ("On now:", before the first event's name) */
  .ev + .ev { margin-top: 8px; }
  .ev-card b a { color: var(--text); }
  .ev-card .ev-when { color: var(--muted); font-size: 13px; margin-left: 2px; }
  .ev-card p { margin: 2px 0 0; font-size: 14px; }
  .ev-card .what { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap topbar">
  <header class="top"></header><script src="header.js"></script>
</div>
<div class="wrap home">

  <div class="hero">
    <h1>Guild Wars Today</h1>
    <span class="td-mini" id="td-pick"><button type="button" class="link" id="td-now" hidden>back to now</button><input type="date" id="td-date" title="Look at another day" aria-label="Look at another day"></span>
  </div>

  <div class="gsearch">
    <input type="search" id="q" placeholder="Search skills, missions, areas, quests, bosses, Nick items — or paste a template code" autocomplete="off">
  </div>
  <div class="results" id="results"></div>

  <div class="sections" id="sections">
    <div id="ev-now"></div>
    <h2 id="td-h2">Today <a class="h-more" href="rotations">Full rotations →</a></h2>
    <div class="today" id="today"></div>
    <div id="ev-next"></div>
    <div class="rnd-maps" id="rnd-maps"></div>
  </div>
  <div id="view" class="ent" hidden></div>
  <footer class="site-footer"><a href="about">About</a> · <a href="thanks">Thanks</a> · <a href="contact">Contact</a> · <a href="license">License &amp; credits</a> · Code MIT · Data CC BY-NC-SA 4.0 from GuildWiki.de · Not affiliated with ArenaNet or NCSOFT</footer>
</div>

<script>
"use strict";
const SKILL_LIST = Object.values(SKILLS).filter(s => !s.pvp_only);
const MISSION_LIST = Object.values(MISSIONS);
const AREA_LIST = Object.values(AREAS).filter(l => !isPvP(l) && l.type !== 14 && l.type !== 17);
const QUEST_LIST = Object.values(QUESTS);
// every boss (bossTable, common.js: the elites' captures, the areas' and missions' bosses, our spots), with where it is
const BOSS_LIST = [...bossTable().values()].map(c => ({ c, where: [...c.where].map(i => MISSIONS[i]?.name || AREAS[i]?.name).filter(Boolean).slice(0, 3).join(", ") }));
for (const s of SKILL_LIST) s._k = fold(`${s.name} ${aliasText("skills", s.id)}`);
for (const m of MISSION_LIST) m._k = fold(`${m.name} ${aliasText("areas", m.id)} ${aliasText("areas", m.outpost)}`);
for (const l of AREA_LIST) l._k = fold(`${l.name} ${aliasText("areas", l.id)}`);
for (const q of QUEST_LIST) q._k = fold(q.name);
for (const x of BOSS_LIST) x.k = fold(x.c.name);
const STORY = new Set((QUESTDATA.storylines || []).flatMap(s => [...(s.nodes || []), ...(s.parts || []).flatMap(p => p.steps)]).map(n => n.quest).filter(Boolean));

// "Something random": today's Zaishen Vanquish on its map, beside this week's Nicholas the Traveler on his (the ways to
// him drawn, their lengths left to the Rotations page), then a player build and a hero build from the Builds page
// the moment the front page shows: now, or a day picked (in the address: ?d=2026-11-25, at this time of day), its clock
// running on from there
const NOW = () => { const m = (args().get("d") || "").match(/^(\d{4})-(\d{2})-(\d{2})$/), now = new Date();
  const off = m ? new Date(+m[1], +m[2] - 1, +m[3], now.getHours(), now.getMinutes(), now.getSeconds()) - now : 0;
  return Date.now() + (isNaN(off) ? 0 : off); };
// (the two maps' width over height, so they're the same height side by side)
const RND_ASPECT = 4 / 3;
function renderMaps() {
  const vq = Rotation.current(ROTATIONS["zaishen-vanquish"], NOW())?.area, nick = ROTATIONS["nicholas-traveler"], n = Rotation.current(nick, NOW());
  const maps = [AREAS[vq]?.set != null && `<div class="rnd-map"><small>Today's Zaishen Vanquish: ${LINK.area(vq)}</small>${mapHTML([vq], { aspect: RND_ASPECT })}</div>`,
    n?.at && AREAS[n.area]?.set != null && `<div class="rnd-map"><small>This week's Nicholas: <a href="nicholas${query({ nick: nick.entries.indexOf(n) })}">${n.count} ${esc(n.item)}</a>, ${LINK.area(n.area)}</small><div id="rnd-nick"></div></div>`].filter(Boolean);
  $("rnd-maps").innerHTML = maps.join("");
  initMaps($("rnd-maps"));
  // (his map with the ways to him, as on the Rotations page)
  if ($("rnd-nick")) nickMap($("rnd-nick"), nick.entries.indexOf(n), { aspect: RND_ASPECT, note: "" });
}

// (the PvE rotations: no Zaishen Combat, Shining Blade or PvP bonus)
const TODAY = [["zaishen-mission", "Mission"], ["zaishen-vanquish", "Vanquish"], ["zaishen-bounty", "Bounty"],
  ["nicholas-sandford", "Sandford"], ["vanguard", "Vanguard"], null, ["weekly-pve", "PvE bonus"], ["nicholas-traveler", "Nicholas"]];
// Today: the day's rotations (the marks on each entry are the picked character's, as everywhere)
function renderToday() {
  const t = NOW();
  $("today").innerHTML = rotationListHTML(TODAY, t);
  // (the field is left alone while it's being used, and when it already says the day: a write while Chrome's popup
  // is open snaps the popup back to the shown month)
  if (document.activeElement !== $("td-date") && $("td-date").value !== ymd(t)) $("td-date").value = ymd(t);
  $("td-now").hidden = !args().has("d");
}
renderToday();
setInterval(renderToday, 30000);
// another day picked (kept in the address, ?d=2026-11-20): the day's rotations, events and maps drawn for it; a search
// in progress is cleared, so the day shows
const pickDay = d => { const p = new URLSearchParams(location.search); if (d) p.set("d", d); else p.delete("d"); p.delete("q");
  history.replaceState(null, "", location.pathname + (p.size ? "?" + p : "")); if ($("q").value) { $("q").value = ""; render(); } renderToday(); renderEvents(); renderMaps(); };
$("td-date").addEventListener("change", () => pickDay($("td-date").value));
$("td-now").addEventListener("click", () => pickDay(""));
// the picked character or its progress changed (in another tab): today's marks drawn again
addEventListener("userchange", renderToday);

// the running event above Today, the next one below it
function renderEvents() {
  const now = new Date(NOW());
  const evs = Object.values(EVENTS).map(e => ({ e, w: eventWindow(e, now) })).sort((a, b) => a.w[0] - b.w[0]);
  // a box: each event's name, when and blurb; the first line starts with the box's label ("On now:") and ends with the
  // All events link
  const one = ({ e, w: [a, b] }, state, label) => `<div class="ev"><div class="ev-line">${label ? `<span class="ev-k">${label}:</span> ` : ""}<b><a href="events">${esc(e.name)}</a></b> `
    + `<span class="ev-when">${state === "on" ? `ends ${eventAway(b - now)}` : `starts ${eventAway(a - now)}`}</span>`
    + `${label ? `<a class="h-more" href="events">All events →</a>` : ""}</div><p>${text(e.blurb, true)}</p></div>`;
  const card = (title, xs, state) => `<div class="ev-card">${xs.map((x, i) => one(x, state, i ? "" : title)).join("")}</div>`;
  // one box: the events on now, above Today; with none on, the next event, below it
  const on = evs.filter(x => x.w[0] <= now), next = evs.find(x => x.w[0] > now);
  $("ev-now").innerHTML = on.length ? card("On now", on, "on") : "";
  $("ev-next").innerHTML = !on.length && next ? card("Next event", [next], "next") : "";
}
renderEvents();
setInterval(renderEvents, 60000);
renderMaps();

// the site's own pages, found by name or by what they hold: the top bar's groups in their order, then each guide,
// My Characters' tabs, and the small pages at the foot
const PAGES = [
  ["Rotations", "rotations", "Zaishen dailies, Nicholas and the weekly bonuses", "rotation rotations zaishen daily weekly nicholas bonus bounty vanquish traveler sandford zb zm zv zc"],
  ["Nicholas the Traveler", "nicholas", "Where he stands each week, what he wants, the way to him, and his whole rotation to search", "nicholas traveler nick collector gift week map rotation"],
  ["Tools", "tools", "Pages that work things out for you: what to capture, what to do next, what to plan around", "tools tool"],
  ["GWAMM route", "gwamm", "What the character picked should do next on the way to God Walking Amongst Mere Mortals", "gwamm god walking route next titles"],
  ["Elite captures", "captures", "Every elite the character picked is missing, with the easiest capture and the way there", "elite elites capture captures skill hunter boss"],
  ["Anniversary planner", "anniversary", "Plan an Anniversary Celebration around the Zaishen Missions: double rewards", "anniversary planner zaishen mission event birthday"],
  ["Builds", "builds", "Team, player and hero builds: what each does, how to gear it, how heroes should behave", "build builds team hero player bar meta"],
  ["Skillbar builder", "builder", "Template codes, attributes and skill bars: decode a code, change it, save your own", "builder build bar template code attributes"],
  ["Guides", "guides", "Step-by-step guides for farms, runs and quest routes", "guide guides farm farms route afk solo"],
  ["The game", "world", "Everything there is to look up and to complete, across all four campaigns", "game world everything"],
  ["Storylines", "storylines", "The story per campaign: primary quests and missions", "quest quests mission missions story storyline flow primary campaign"],
  ["Missions", "missions", "Missions with rewards, bosses and foes", "mission missions boss reward foe pvp"],
  ["Skills", "skills", "All skills with filters, capture bosses and trainers", "skill skills list elite capture trainer"],
  ["Maps", "maps", "Where you can walk in every region; click an area for its page", "map maps region continent walkable"],
  ["Areas", "areas", "Every place: its exits, its map with its bosses, its quests and services, its vanquish", "area areas outpost town explorable vanquish place"],
  ["Quests", "quests", "Every quest: primary, secondary, event and more", "quest quests secondary event all"],
  ["Skill quests", "quests?sq=1", "Every quest that rewards a skill", "skill quest quests reward"],
  ["Dungeons", "dungeons", "Every dungeon: its levels, its boss, where it's entered and its next Zaishen Bounty", "dungeon dungeons level bounty eotn"],
  ["Bosses", "bosses", "Every boss: its elite to capture and where it is", "boss bosses elite capture signet"],
  ["Heroes", "heroes", "Which campaigns each hero needs, and how to recruit them", "hero heroes recruit campaign"],
  ["Armor", "armor", "Craftable armor sets: gold, materials and where", "armor armour set crafter material gold prestige elite"],
  ["Titles", "titles", "The titles with ranks worth knowing: what earns them, each rank, and the skills they power", "title titles rank ranks track"],
  ["Yearly events", "events", "Every festival that comes back each year, the running or next one first", "event events festival yearly wintersday halloween canthan new year dragon festival"],
  ...(data("GW_GUIDES")?.guides || []).filter(g => !g.wip).map(g => [g.name, `guides?${g.id}`, g.summary, `guide ${g.tags.join(" ")}`]),
  ["My Characters", "characters", "Your characters, their progress and their heroes", "character characters my progress account edit"],
  ["Accounts", "characters?view=accounts", "Your accounts and the account titles", "account accounts character characters"],
  ["Characters overview", "characters-overview", "All your characters at a glance", "character characters overview"],
  ["Birthdays", "characters-birthdays", "When your characters were made, and how old they are", "birthday birthdays age character characters"],
  ["Backup", "backup", "Keep a copy of your progress, or move it to another browser", "backup restore export import progress"],
  ["About", "about", "What this site is and how it works", "about site"],
  ["Contact", "contact", "How to reach the site's author", "contact discord"],
  ["Thanks", "thanks", "Everyone this site builds on", "thanks credits contributors"],
  ["License & credits", "license", "Sources and licenses", "license credits copyright"],
].map(([name, href, about, words]) => ({ name, href, about, _k: fold(`${name} ${words}`) }));


const LIMIT = 8;
// a date later than this year shows its year (Nicholas the Traveler's items come round only every few years)
const fmtDay = new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric" });
const fmtYear = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" });
const fmtNext = { format: t => (new Date(t).getFullYear() === new Date().getFullYear() ? fmtDay : fmtYear).format(t) };
const rank = (k, t) => (k.startsWith(t) ? 0 : k.includes(" " + t) ? 1 : 2);

function search(q) {
  const ts = fold(q).split(/\s+/).filter(Boolean);
  if (!ts.length) return null;
  // a typed plural also finds the singular ("mursaat tokens", "energy surges")
  const has = k => ts.every(t => k.includes(t) || (t.length > 3 && t.endsWith("s") && k.includes(t.slice(0, -1))));
  const q0 = fold(q).trim(), exact = x => (fold(x.name ?? x.c.name) === q0 ? 0 : 1);  // (a thing named exactly as typed first)
  const best = (list, k = x => x._k) => list.filter(x => has(k(x))).sort((a, b) => exact(a) - exact(b) || rank(k(a), ts[0]) - rank(k(b), ts[0]) || (b.elite === true) - (a.elite === true) || cmpStr(a.name ?? a.c.name, b.name ?? b.c.name));  // (skills: elites first)
  // a word matches as typed or as its plural/singular ("skills" finds "skill quests")
  const word = (w, t) => w.startsWith(t) || (w.length >= 4 && t.startsWith(w) && t.length - w.length <= 1);
  // rotation entries (Nicholas's items, bounty targets, bonuses...), once per rotation, by when they're next up
  const rotations = [];
  for (const r of Object.values(ROTATIONS)) {
    const seen = new Set();
    for (const e of r.entries) {
      const n = entryName(e);
      if (seen.has(n) || !has(fold(n))) continue;
      seen.add(n);
      const k = Rotation.period(r);
      let i = 0;
      while (i < r.entries.length && entryName(Rotation.entry(r, k + i)) !== n) i++;
      rotations.push({ r, e: Rotation.entry(r, k + i), i, at: Rotation.startsAt(r, k + i) });
    }
  }
  rotations.sort((a, b) => a.at - b.at);
  // (the pages: those named by the words first, then those that only list them among their terms)
  const pageRank = p => (ts.every(t => fold(p.name).split(" ").some(w => word(w, t))) ? 0 : 1);
  const pages = PAGES.filter(p => ts.every(t => p._k.split(" ").some(w => word(w, t)))).sort((a, b) => pageRank(a) - pageRank(b));
  return { ts, q: q0, pages, skills: best(SKILL_LIST),
    missions: best(MISSION_LIST), areas: best(AREA_LIST), quests: best(QUEST_LIST), bosses: best(BOSS_LIST, x => x.k), rotations };
}

// (the pages are few: all of them shown)
function section(title, items, render, moreHref, limit = LIMIT) {
  if (!items.length) return "";
  return `<h2>${title} · ${items.length}</h2>` + items.slice(0, limit).map(render).join("")
    + (items.length > limit && moreHref ? `<a class="more" href="${moreHref}">Show all ${items.length} →</a>` : "");
}

// a skill template code in the search (typed, pasted, or a builder link holding one): the Builder, with it
const templateIn = q => { const code = q.trim().replace(/^.*[#?&]code=/, ""); if (!/^[A-Za-z0-9+/=]{8,}$/.test(code)) return null; try { TemplateCode.decode(code); return code; } catch { return null; } };
function render() {
  const q = $("q").value, code = templateIn(q);
  if (code) { location.href = "builder?code=" + encodeURIComponent(code); return; }
  const r = search(q);
  $("sections").hidden = !!r;
  if (!r) { $("results").innerHTML = ""; return; }
  const qs = encodeURIComponent(q);
  const hit = (pc, href, title, sub, right) => `<a class="hit" style="--pc:${pc}" href="${href}"><span>${title} <span class="s">${sub}</span></span><span class="s">${right}</span></a>`;
  // each kind's row, and the page with all its hits
  const KINDS = {
    skills: [s => hit(profVar(s.profession), HREF.skill(s.id), `${skillIcon(s.id, "sk-ic sm")}<span class="t">${highlight(s.name, r.ts)}</span>`,
      [s.profession ? PROFS[s.profession] : "Common", ATTRIBUTES[s.attribute]].filter(Boolean).map(esc).join(" · "), esc(s.label || "")), `skills?q=${qs}`, "Skills"],
    missions: [m => hit(profVar(0), HREF.mission(m.id), `<span class="t">${highlight(m.name, r.ts)}</span>`,
      `${m.kind === "pvp" ? "PvP" : CAMPAIGNS[missionCampaign(m)]} · ${esc(missionRegion(m)?.name || "")}`, esc(m.kind === "story" ? "Mission" : m.kind)), `missions?q=${qs}`, "Missions"],
    areas: [l => hit(`var(${isOutpost(l) ? "--loc-out" : "--loc-exp"})`, HREF.area(l.id), `<span class="t">${highlight(l.name, r.ts)}</span>`,
      `${CAMPAIGNS[campaignOf(l)] || ""} · ${esc(regionOf(l)?.name || "")}`, esc(TYPE_LABEL[l.type] || "")), "areas", "Areas"],
    quests: [x => hit(STORY.has(x.id) ? profVar(0) : "var(--q-skill)", HREF.quest(x.id), `<span class="t">${highlight(x.name, r.ts)}</span>`,
      `${CAMPAIGNS[questCampaign(x)]} · ${esc(questRegion(x)?.name || "")}`, STORY.has(x.id) ? "Story quest" : x.skills?.length ? "Skill quest" : `${esc(x.type)} quest`), `quests?q=${qs}`, "Quests"],
    bosses: [({ c, where }) => hit(profVar(c.prof || c.profession), HREF.boss(c.id), `<span class="t">${highlight(c.name, r.ts)}</span>`,
      esc(where), esc((c.elites || []).map(e => SKILLS[e]?.name).filter(Boolean).join(", "))), `bosses?q=${qs}`, "Bosses"],
    rotations: [({ r: rot, e, i, at }) => hit("var(--accent)", `rotations${query({ q: entryName(e) })}`,
      `<span class="t">${e.count ? `${e.count} ` : ""}${highlight(entryName(e), r.ts)}</span>`, `${esc(rot.title)}${e.creature && e.area ? ` · ${esc(areaName(e.area))}` : ""}`,
      i ? `next ${fmtNext.format(at)}` : "now"), null, "Rotations"],
  };
  // the pages, the rotations (the day a thing is next up), then the kinds by how well their best hit matches: a thing
  // named exactly as typed, then a name that starts with the words, then one with them inside
  // (missions and areas are one kind, Places: a mission is its outpost's; the rows say which is which)
  r.places = [...r.missions.map(m => ({ m })), ...r.areas.map(l => ({ l }))].map(x => ({ ...x, name: (x.m || x.l).name }))
    .sort((a, b) => (fold(b.name) === r.q) - (fold(a.name) === r.q) || rank(fold(a.name), r.ts[0]) - rank(fold(b.name), r.ts[0]) || !!b.m - !!a.m || cmpStr(a.name, b.name));
  KINDS.places = [x => (x.m ? KINDS.missions[0](x.m) : KINDS.areas[0](x.l)), `areas?q=${qs}`, "Places"];
  const nameOf = { skills: x => x.name, places: x => x.name, quests: x => x.name, bosses: x => x.c.name };
  const strength = k => (!r[k].length ? 9 : fold(nameOf[k](r[k][0])) === r.q ? -1 : rank(fold(nameOf[k](r[k][0])), r.ts[0]));
  const kinds = ["skills", "places", "quests", "bosses"].sort((a, b) => strength(a) - strength(b));
  $("results").innerHTML =
    section("Pages", r.pages, p => hit("var(--accent)", p.href, `<span class="t">${esc(p.name)}</span>`, esc(p.about), "→"), null, Infinity) +
    section("Rotations", r.rotations, KINDS.rotations[0], null) +
    kinds.map(k => section(KINDS[k][2], r[k], KINDS[k][0], KINDS[k][1])).join("") ||
    `<p class="dim" style="padding:12px 0">Nothing found.</p>`;
}

$("q").addEventListener("input", () => {
  // (the search kept in the address, beside a picked day)
  const p = new URLSearchParams(location.search); if ($("q").value) p.set("q", $("q").value); else p.delete("q");
  history.replaceState(null, "", location.pathname + (p.size ? "?" + p : ""));
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("q").value = ""; render(); $("q").focus(); }
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});

// a game thing's own page (./?area=146, ./?skill=1234, …): the home page gives way to it
function route(e) {
  // a dungeon's old area link: its own page now
  if (isDungeon(AREAS[args().get("area")])) history.replaceState(null, "", HREF.dungeon(args().get("area")));
  // and the other way: a dungeon link to one of its levels (or a quest area the game types as a dungeon) is its area page
  { const d = args().get("dungeon"); if (d && AREAS[d] && !isDungeon(AREAS[d])) history.replaceState(null, "", HREF.area(d)); }
  const p = args(), k = Object.keys(VIEWS).find(k => p.has(k)), v = VIEWS[k], x = v?.find(p.get(k));
  for (const sel of [".hero", ".gsearch", "#results", "#sections"]) document.querySelector(sel).style.display = k ? "none" : "";
  $("view").hidden = !k;
  // the menu marks the list the thing is in
  const menu = { area: "areas", mission: "missions", skill: "skills", hero: "heroes" }[k] || "./";
  for (const a of document.querySelectorAll("nav.pages a")) if (a.getAttribute("href") === menu) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  if (!k) {
    $("view").innerHTML = "";
    document.title = TITLE;
    $("q").value = p.get("q") || "";
    render();
    // (the search box focused on arriving, from here and not by autofocus: with that attribute in the page Chrome
    // doesn't restore the scroll on a reload, even on a thing's page where the box is hidden)
    if (!e) $("q").focus({ preventScroll: true });
    return;
  }
  $("view").dataset.at = `${k}=${p.get(k)}`;
  // (nothing by that id: say so, with a search and the way to the list of that kind)
  const LISTS = { area: "areas", mission: "missions", quest: "quests", boss: "bosses", skill: "skills", dungeon: "dungeons", title: "titles", hero: "heroes", nick: "nicholas" };
  $("view").innerHTML = x ? v.html(x) : `<p class="back"><a href="./">← Home</a></p><p class="dim">There's no ${esc(k)} ${esc(p.get(k))}.</p>
    <form class="nf" action="./"><input type="search" name="q" placeholder="Search for it by name: skills, areas, missions, quests, bosses…" autofocus></form>
    ${LISTS[k] ? `<p><a href="${LISTS[k]}">All ${LISTS[k]} →</a></p>` : ""}`;
  if (x) { initMaps($("view")); v.after?.($("view"), x); }
  document.title = x ? `${v.title(x)} · GW` : TITLE;
  // (to the top on a link followed in place; a reload or a step back keeps the browser's own place in the page)
  if (e?.type === "route") window.scrollTo(0, 0);
}
const TITLE = document.title;
route();
onRoute(route);
</script>
</body>
</html>
