<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<title>GW Missions</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="missions">
<div class="wrap">
  <header class="top"></header><script src="header.js"></script>
  <div class="page-title"><h1>Missions</h1><p>Rewards, bosses with their elites, foes and allies</p></div>

  <div id="browse">
  <div class="filters" id="filters">
    <div class="frow">
      <input type="search" id="f-name" placeholder="Mission — e.g. thirsty, gate, vizunah" autocomplete="off" autofocus>
      <input type="search" id="f-who" placeholder="Boss, elite skill or foe — e.g. energy surge, mursaat" autocomplete="off">
      <span class="search-hint"><kbd>/</kbd> search · <kbd>Esc</kbd> clear</span>
    </div>
    <div class="frow">
      <div class="profs" id="f-camp"></div>
    </div>
    <div class="frow">
      <select id="f-type"><option value="">Any type</option></select>
      <select id="f-region"><option value="">Any region</option></select>
      <select id="f-party"><option value="">Any party size</option></select>
      <select id="f-elite"><option value="">Elites of any profession</option></select>
      <label class="chk" title="Elites the character picked on the User page hasn't captured"><input type="checkbox" id="f-cap"> Elites to capture</label>
      <select id="f-done" title="As ticked for the character picked on the User page"><option value="">Done or not</option><option value="1">Not done in NM</option><option value="2">Not done in HM</option></select>
      <label class="chk"><input type="checkbox" id="f-pvp"> PvP maps</label>
      <button class="reset" id="reset">Reset</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="head" id="head">
    <button data-sort="story" class="num" title="Story order">#</button>
    <button data-sort="name">Mission</button>
    <button data-sort="campaign">Campaign</button>
    <button data-sort="region" class="col-region">Region</button>
    <button data-sort="type" class="col-type">Type</button>
    <button data-sort="party" class="num col-party" title="Party size">Party</button>
    <span>Elite captures</span>
    <span class="col-tick" title="For the character picked on the User page">Done</span>
  </div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>No missions match.</div>
  </div>
  <footer class="site-footer"><a href="about">About</a> · <a href="license">License &amp; credits</a> · <a href="thanks">Thanks</a> · <a href="contact">Contact</a> · Code MIT · Data CC BY-NC-SA 4.0 from GuildWiki.de · Not affiliated with ArenaNet or NCSOFT</footer>
</div>

<script src="game/missions.js"></script>
<script src="game/ground.js"></script>
<script src="game/maps.js"></script>
<script src="game/skills.js"></script>
<script src="game/creatures.js"></script>
<script src="game/heroes.js"></script>
<script src="game/quests.js"></script>
<script src="game/calendar.js"></script>
<script src="data/calendar.js"></script>
<script src="data/nicholas.js"></script>
<script src="data/builds.js"></script>
<script src="data/aliases.js"></script>
<script src="common.js"></script>
<script src="mapwidget.js"></script>
<script src="missions.js"></script>
</body>
</html>
