<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<title>GW Dungeons</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dungeons">
<div class="wrap">
  <header class="top"></header><script src="header.js"></script>
  <div class="page-title"><h1>Dungeons</h1><p>Every dungeon: its levels, its boss, where it's entered and its next Zaishen Bounty</p></div>
  <div class="u-row"><select id="done" title="As ticked for the character picked on My Characters"><option value="">Done or not</option><option value="1">Missing NM</option><option value="2">Missing HM</option><option value="a">Missing either</option></select></div>
  <table class="dgtable"><thead id="head"></thead><tbody id="list"></tbody></table>
  <footer class="site-footer"><a href="about">About</a> · <a href="thanks">Thanks</a> · <a href="contact">Contact</a> · <a href="license">License &amp; credits</a> · Code MIT · Data CC BY-NC-SA 4.0 from GuildWiki.de · Not affiliated with ArenaNet or NCSOFT</footer>
</div>

<script src="game/ground.js"></script>
<script src="game/quests.js"></script>
<script src="game/creatures.js"></script>
<script src="game/calendar.js"></script>
<script src="data/calendar.js"></script>
<script src="data/depths.js"></script>
<script src="common.js"></script>
<script>
"use strict";
// every dungeon (not the quest areas the game also counts as dungeons, nor a level listed on its own, nor Destruction's
// Depths: a mission, though the game types it a dungeon, and not one of Master of the North's), by region
const DEPTHS = data("GW_DEPTHS")?.dungeons || {};
const dungeons = Object.values(AREAS).filter(l => isDungeon(l) && l.id !== 670)
  .sort((a, b) => (regionOf(a)?.name || "").localeCompare(regionOf(b)?.name || "") || a.name.localeCompare(b.name));
// the boss: the last level's, from our data, else the Zaishen Bounty's
const bossOf = l => DEPTHS[l.id]?.levels.at(-1)?.marks.find(m => m[0] === "boss")?.[3] || entryName(ROTATIONS["zaishen-bounty"]?.entries.find(e => e.area === l.id) || {});
const bossLink = name => { const id = Object.keys(CREATURES).find(k => CREATURES[k].name === name); return id ? LINK.boss(id) : esc(name); };
const outside = l => [...new Set((l.exits || []).map(e => e.to))].filter(i => AREAS[i] && AREAS[i].type !== 18);
const rows = dungeons.map(l => ({ l, book: DEPTHS[l.id]?.book, levels: DEPTHS[l.id]?.levels.length || l.levels || 0, boss: bossOf(l),
  region: regionOf(l)?.name || "", from: outside(l), bounty: bountyAt(l.id)?.days }));
// the columns: [key, label, sort value (missing ones last), cell]
const last = v => (v == null || v === "" ? Infinity : v);
const COLS = [
  ["book", "#", r => last(r.book), r => r.book ?? ""],
  ["name", "Dungeon", r => r.l.name, r => `<a href="${HREF.dungeon(r.l.id)}">${esc(r.l.name)}</a>`],
  ["region", "Region", r => r.region, r => `<span class="dim">${esc(r.region)}</span>`],
  ["levels", "Levels", r => last(r.levels || null), r => r.levels || ""],
  ["boss", "Boss", r => r.boss || "~", r => (r.boss ? bossLink(r.boss) : "")],
  ["from", "Entered from", r => areaName(r.from[0]) || "~", r => r.from.map(i => LINK.area(i)).join(", ")],
  ["bounty", "Bounty", r => last(r.bounty), r => (r.bounty == null ? "" : r.bounty === 0 ? "<b>Today</b>" : inDays(r.bounty))],
  // done in normal and hard mode, as ticked for the character picked on My Characters
  ["done", "Done", r => prog[r.l.id] || 0, r => (isTickedDungeon(r.l.id) ? doneTicks("dungeons", r.l.id, prog[r.l.id] || 0) : "")],
];
const NUM = new Set(["book", "levels", "bounty"]);
const state = { sort: args().get("sort")?.replace(/^-/, "") || "book", desc: args().get("sort")?.startsWith("-") || false };
const done = document.getElementById("done");
done.value = args().get("d") || "";
let prog;
function render() {
  prog = User.char().dungeons;
  const [, , key] = COLS.find(c => c[0] === state.sort) || COLS[0];
  const cmp = (a, b) => { const x = key(a), y = key(b); return (typeof x === "number" ? x - y : x.localeCompare(y)) || a.l.name.localeCompare(b.l.name); };
  const sorted = [...rows].filter(r => !done.value || isTickedDungeon(r.l.id) && missing(prog[r.l.id], done.value)).sort((a, b) => (state.desc ? -cmp(a, b) : cmp(a, b)));
  document.getElementById("head").innerHTML = `<tr>${COLS.map(([k, label]) => `<th class="c-${k}${NUM.has(k) ? " num" : ""}${k === "done" ? " bulk" : ""}"${k === "done" ? ' tabindex="0"' : ""}><button type="button" data-sort="${k}" class="${k === state.sort ? `sorted${state.desc ? " desc" : ""}` : ""}">${label}</button>${k === "done" ? bulkMenu("#list", true) : ""}</th>`).join("")}</tr>`;
  document.getElementById("list").innerHTML = sorted.map(r => `<tr>${COLS.map(([k, , , cell]) => `<td class="c-${k}${NUM.has(k) ? " num" : ""}">${cell(r)}</td>`).join("")}</tr>`).join("");
}
document.getElementById("head").addEventListener("click", e => {
  const b = e.target.closest("button[data-sort]");
  if (!b) return;
  if (state.sort === b.dataset.sort) state.desc = !state.desc; else { state.sort = b.dataset.sort; state.desc = false; }
  address();
  render();
});
done.addEventListener("change", () => { address(); render(); });
// the sort (but the book's) and the filter, in the address
function address() {
  const p = new URLSearchParams();
  if (state.sort !== "book" || state.desc) p.set("sort", (state.desc ? "-" : "") + state.sort);
  if (done.value) p.set("d", done.value);
  history.replaceState(null, "", p.size ? "?" + p : location.pathname);
}
render();
addEventListener("userchange", render);
</script>
</body>
</html>
