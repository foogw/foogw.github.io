<title>GW Birthdays</title>
<link rel="stylesheet" href="style.css">
<style>
  .xp-bd { width: 100%; border-collapse: collapse; font-size: 14px; }
  .xp-bd th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .xp-bd td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  .xp-bd .n { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; color: var(--text); }
  .xp-bd a.n:hover { color: var(--accent); }
  .xp-bd .n img { width: 20px; height: 20px; }
  .xp-bd .num { text-align: right; font-variant-numeric: tabular-nums; }
  .xp-bd .d { font-variant-numeric: tabular-nums; }
  .xp-bd .now { color: var(--accent); }
  .xp-bd .arr { font-weight: 200; }
  .xp-bd .chk { width: 200px; }
  .xp-bd th button { all: unset; cursor: pointer; }
  .xp-bd th button:hover { color: var(--text); }
  .xp-bd .add { display: flex; gap: 6px; align-items: center; }
  .xp-bd .known { padding: 5px 0; border: 1px solid transparent; }  /* (as tall as the Add button: the row keeps its height) */
  .xp-age { width: 110px; font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }  /* (its room kept even with no check to suggest) */
  .xp-bd .dim { color: var(--muted); }
</style>
</head>

<div class="wrap">
