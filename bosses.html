<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<title>GW Bosses</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="bosses">
<div class="wrap">
  <header class="top"></header><script src="header.js"></script>
  <div class="page-title"><h1>Bosses</h1><p>Every boss with an elite to capture or a mission to fight in</p></div>

  <div id="browse">
  <div class="filters" id="filters">
    <div class="frow">
      <input type="search" id="f-name" placeholder="Boss, elite skill or area — e.g. ravenheart, energy surge, wilds" autocomplete="off" autofocus>
      <span class="search-hint"><kbd>/</kbd> search · <kbd>Esc</kbd> clear</span>
    </div>
    <div class="frow">
      <div class="profs" id="f-prof"></div>
    </div>
    <div class="frow">
      <select id="f-camp"><option value="">Any campaign</option></select>
      <label class="chk"><input type="checkbox" id="f-elite"> With an elite only</label>
      <label class="chk" title="Elites the character picked on My Characters hasn't captured"><input type="checkbox" id="f-cap"> Elites to capture</label>
      <button class="reset" id="reset">Reset</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="head" id="head">
    <span>Boss</span>
    <span class="col-prof">Profession</span>
    <span>Elite captures</span>
    <span class="col-where">Where</span>
    <span class="col-camp" title="Campaign">Camp</span>
  </div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>No bosses match.</div>
  </div>
  <footer class="site-footer"><a href="about">About</a> · <a href="thanks">Thanks</a> · <a href="contact">Contact</a> · <a href="license">License &amp; credits</a> · Code MIT · Data CC BY-NC-SA 4.0 from GuildWiki.de · Not affiliated with ArenaNet or NCSOFT</footer>
</div>

<script src="game/creatures.js"></script>
<script src="game/skills.js"></script>
<script src="game/ground.js"></script>
<script src="game/maps.js"></script>
<script src="game/missions.js"></script>
<script src="common.js"></script>
<script src="mapwidget.js"></script>
<script src="bosses.js"></script>
</body>
</html>
