<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GW Quests</title>
<!-- the skill quests are the Quests page's "Skill quests" filter now: an old address goes there, with its search -->
<script>
const q = new URLSearchParams(location.search || (location.hash.includes("=") ? location.hash.slice(1) : "")).get("q");
location.replace("quests?" + new URLSearchParams(q ? { sq: 1, q } : { sq: 1 }));
</script>
</head>
<body><p><a href="quests?sq=1">Skill quests</a></p></body>
</html>
