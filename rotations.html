<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<title>GW Rotations</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="rotations">
<div class="wrap">
  <header class="top"></header><script src="header.js"></script>
  <div class="page-title"><h1>Rotations</h1><p>Zaishen dailies, Nicholas and the weekly bonuses</p></div>

  <div id="browse">
  <div class="r-tools">
    <input type="search" id="find" placeholder="When is it next? — e.g. urgoz, thirsty river, extra luck" autocomplete="off" autofocus>
    <span class="dim" id="tz"></span>
  </div>

  <div id="nowbox"><h2 class="r-h">Now</h2>
  <div class="today r-nowlist" id="now"></div></div>

  <h2 class="r-h">Daily</h2>
  <div class="r-scroll"><table class="r-table" id="daily"></table></div>
  <button class="link r-more" type="button" data-more="daily"></button>

  <h2 class="r-h">Weekly</h2>
  <div class="r-scroll"><table class="r-table" id="weekly"></table></div>
  <button class="link r-more" type="button" data-more="weekly"></button>

  <h2 class="r-h" id="nickbox">Nicholas the Traveler <span class="dim" id="nick-what"></span></h2>
  <div id="nick"></div>
  </div>
  <div id="bonus" class="ent" hidden></div>

  <footer class="site-footer"><a href="about">About</a> · <a href="license">License &amp; credits</a> · <a href="thanks">Thanks</a> · <a href="contact">Contact</a> · Code MIT · Data CC BY-NC-SA 4.0 from GuildWiki.de · Not affiliated with ArenaNet or NCSOFT</footer>
</div>

<script src="game/calendar.js"></script>
<script src="data/nicholas.js"></script>
<script src="game/ground.js"></script>
<script src="game/missions.js"></script>
<script src="game/creatures.js"></script>
<script src="game/quests.js"></script>
<script src="game/maps.js"></script>
<script src="common.js"></script>
<script src="mapwidget.js"></script>
<script src="data/routing.js"></script>
<script src="walkroute.js"></script>
<script src="nicholas.js"></script>
<script src="rotations.js"></script>
</body>
</html>
